<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dual Thermometer Web 1.0</title>
    <script src="static/js/chart.js"></script>
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/css/bootstrap-icons.min.css">
    <link rel="stylesheet" href="static/css/bootstrap-icons-animations.min.css">
    <script src="static/js/bootstrap.min.js"></script>
    <script src="static/js/index.js?ver=1.7" defer></script>
</head>
<body>
<!--Navbar-->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <a class="navbar-brand" href="#">Dual Thermometer Web 1.0</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor02"
            aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor02">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="#">Graphs <span class="sr-only">(current)</span></a>
            </li>
        </ul>
    </div>
</nav>

<!--App body-->
<div class="container p-3">
    <div class="row">
        <!--Chart column -->
        <div class="col-8">
            <canvas id="myChart"></canvas>
        </div>
        <!--Devices column -->
        <div class="col-4">
            <div class="row">
                <div class="d-flex align-items-center justify-content-between w-100">
                    <h5 class="mb-0 d-flex align-items-center gap-2">
                        <i class="bi bi-bluetooth mr-1"></i><span id="devices-title">Devices</span>
                    </h5>
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="bluetoothFunc.scan()">
                        <i id="scan-loader" class="bi bi-arrow-counterclockwise spin"></i> Scan
                    </button>
                </div>
            </div>
            <div class="row pt-2">
                <div class="list-group col-12 pr-0" id="devices-list">
                   <h6>No devices...</h6>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
