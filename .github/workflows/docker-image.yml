name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/stmicroel-avr/dual-sensor-thermometer-web:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/stmicroel-avr/dual-sensor-thermometer-web:latest
